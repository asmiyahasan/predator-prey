name: Send new models to the website

# Runs when a models-vN release is published (by scripts/release.py), or by
# hand from the Actions tab for any existing release tag.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to send, e.g. models-v1"
        required: true

jobs:
  open-pull-request:
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    if: startsWith(github.event.release.tag_name || inputs.tag, 'models-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read # to download this repo's release files

    steps:
      - name: Download the release files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" --repo "${{ github.repository }}" --dir release-files \
            --pattern predator.json --pattern prey.json --pattern parity.json --pattern model_card.json
          ls -l release-files

      - name: Check out the website repo
        uses: actions/checkout@v5
        with:
          repository: asmiyahasan/asmiyahasan.github.io
          token: ${{ secrets.WEBSITE_REPO_TOKEN }}
          path: website

      - name: Put the new files in place
        run: |
          # The champions become the "Hard" opponents
          cp release-files/predator.json website/public/models/predator-hard.json
          cp release-files/prey.json     website/public/models/prey-hard.json
          cp release-files/model_card.json website/public/model_card.json
          # The parity fixtures travel with the models, so the website's tests
          # always check the TypeScript game against the game these models learned in
          cp release-files/parity.json   website/src/game/fixtures/parity.json
          git -C website status --short

      - name: Open a pull request on the website repo
        uses: peter-evans/create-pull-request@v7
        with:
          path: website
          token: ${{ secrets.WEBSITE_REPO_TOKEN }}
          branch: models/${{ env.TAG }}
          commit-message: "Update Hard agents to ${{ env.TAG }}"
          title: "New champion agents: ${{ env.TAG }}"
          body: |
            New champion models were promoted by the evaluation gate and released as
            [${{ env.TAG }}](${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ env.TAG }}).

            This pull request:
            - replaces `public/models/predator-hard.json` and `prey-hard.json` with the new champions
            - updates `public/model_card.json`
            - updates `src/game/fixtures/parity.json` (the recorded games for parity tests)

            The checks below run every parity test against these files.
            Merge when they're green to deploy the new agents.
          delete-branch: true