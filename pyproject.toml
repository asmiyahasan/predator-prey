[project]
name = "predprey"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Asmiya Hasan", email = "asmiya14@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "gymnasium>=1.3.0",
    "numpy>=2.5.3",
    "pettingzoo>=1.27.0",
    "pygame>=2.6.1",
    "stable-baselines3>=2.9.0",
    "tensorboard>=2.21.0",
    "torch>=2.14.0",
]

[project.scripts]
predprey = "predprey:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
